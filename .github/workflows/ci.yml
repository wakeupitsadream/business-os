name: ci

# Гейт качества перед мёржем в main (мёрж = релиз: Timeweb автодеплоит main).
# push ограничен main намеренно: у рабочей ветки с открытым PR события push и
# pull_request запускали бы CI дважды на каждый пуш — так в Agentus за спринт
# ушло ~90% месячных минут Actions.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Реальная база в CI не нужна: юнит-тесты к ней не ходят, а next build
      # только выполняет модули роутов. Строки должны быть валидными, иначе
      # Prisma откажется генерировать клиент.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      AUTH_SECRET: ci-secret-not-a-real-key
      CRON_SECRET: ci-cron-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Клиент Prisma
        run: npx prisma generate

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

  docker:
    # Полная сборка образа тяжёлая, гоняем только перед деплоем (push в main):
    # ошибки Dockerfile/standalone иначе всплывают уже на Timeweb, когда прод
    # стоит. На PR ошибки кода ловит `npm run build` в job `test`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # .build-sha берётся из git — нужна настоящая история, не shallow-заглушка.
          fetch-depth: 0

      - name: Сборка образа
        run: docker build -t business-os:ci .

      - name: Смоук контейнера
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e DATABASE_URL="postgresql://u:p@10.255.255.1:5432/nodb?connect_timeout=2" \
            -e AUTH_SECRET=ci-secret -e CRON_SECRET=ci-cron \
            business-os:ci
          # Health обязан отвечать 200 даже с недоступной базой — это и проверяем.
          up=""
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
            echo "попытка $i → $code"
            if [ "$code" = "200" ]; then up=1; break; fi
            sleep 5
          done
          if [ -z "$up" ]; then docker logs smoke; exit 1; fi

          # Проба базы теперь закрыта секретом, поэтому цикл выше проверяет
          # только анонимную ветку — а она в базу не ходит вовсе. Отдельным
          # запросом дёргаем ветку с проверкой БД: она обязана отвечать 200
          # ровно так же. Иначе главный инвариант («health отвечает 200 при
          # недоступной базе, иначе хостинг откатит исправный деплой»)
          # перестал бы проверяться в CI.
          auth=$(curl -s -o /tmp/health-auth.json -w "%{http_code}" \
            -H "Authorization: Bearer ci-cron" http://127.0.0.1:3000/api/health || true)
          echo "health с секретом → $auth"
          cat /tmp/health-auth.json
          if [ "$auth" != "200" ]; then docker logs smoke; exit 1; fi
          # 200 мало: при разъехавшемся секрете запрос свалился бы в анонимную
          # ветку, которая тоже отвечает 200 — и проверка молча перестала бы
          # что-либо проверять. Требуем именно ветку с походом в базу.
          if ! grep -q '"checked":true' /tmp/health-auth.json; then
            echo "✗ health с секретом не пошёл в базу — проверка ничего не проверяет"
            cat /tmp/health-auth.json; docker logs smoke; exit 1
          fi

          # И ни в одной ветке наружу не должно уехать имя хоста базы.
          curl -s http://127.0.0.1:3000/api/health > /tmp/health-anon.json
          if grep -Eqi 'neon\.tech|:5432|prisma|10\.255\.255\.1' /tmp/health-anon.json /tmp/health-auth.json; then
            echo "✗ health отдаёт наружу адрес базы"; cat /tmp/health-anon.json; exit 1
          fi

          # Отдельно — адрес, на который наведён HEALTHCHECK. Проба намеренно без
          # флага -f, поэтому опечатка в пути даёт 404, а контейнер всё равно
          # считается здоровым: liveness превращается в украшение, и заметить это
          # можно только здесь.
          live=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health/live || true)
          echo "/api/health/live → $live"
          if [ "$live" != "200" ]; then docker logs smoke; exit 1; fi
